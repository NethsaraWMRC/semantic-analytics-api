spring:
  application:
    name: agent

  profiles:
    active: local # you can modify this to any env

  datasource:
    url: 
    username: 
    password: 
    
  jpa:
    hibernate:
      ddl-auto: none

  # creates the chat_messages table from resources/schema.sql if it is missing
  sql:
    init:
      mode: always

cors:
  # Comma-separated origins allowed to call this API from a browser, for example
  #   allowed-origins: http://localhost:5173,http://your-ec2-host
  # Leave empty when the UI is served from the same host as the API, which is the case
  # locally (the Vite proxy) and behind a single nginx. Never use "*".
  allowed-origins:

analytics:
  dataset: shopify_sales

llm:
  # which provider is active: gemini, claude or groq
  provider: groq

  gemini:
    model: gemini-3.6-flash
    api-key:

  claude:
    model: claude-haiku-4-5
    api-key:

  groq:
    base-url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api-key: 
